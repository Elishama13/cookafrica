<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B160D">
<title>Cook Africa — Le carnet de recettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --table: #2B160D;
    --papier: #FDFBF6;
    --violet: #B4A6DA;
    --violet-pale: #E2DCF2;
    --marge: #E0505A;
    --encre: #1D2A6B;   /* stylo bleu */
    --rouge: #B30807;   /* stylo rouge */
    --or: #F1C50E;
    --main: "Kalam", "Comic Sans MS", cursive;
    --ui: "Figtree", system-ui, sans-serif;
    --ligne: 32px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { font-family: var(--ui); background: radial-gradient(120% 80% at 50% 20%, #4A2616, var(--table) 70%); color: var(--papier); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button, a { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--or); outline-offset: 3px; border-radius: 6px; }

  .scene { height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)); }
  .entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .entete img { height: 34px; border-radius: 8px; display: block; }
  .entete a { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; text-decoration: none; background: var(--or); color: #2B160D; padding: 9px 16px; border-radius: 999px; }
  .entete svg { width: 16px; height: 16px; }

  /* Le livre et ses deux couches de page */
  .livre { position: relative; perspective: 2000px; width: 100%; max-width: 560px; justify-self: center; min-height: 0; touch-action: pan-y; user-select: none; }
  .page { position: absolute; inset: 0; border-radius: 4px 14px 14px 4px; overflow: hidden; transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 8px 0 14px -10px rgba(0,0,0,.35); will-change: transform; }
  .page.dessous { visibility: hidden; }
  .page.dessous.visible { visibility: visible; }
  .page .ombre { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 40%); opacity: 0; }
  .feuille { height: 100%; overflow-y: auto; overscroll-behavior: contain; background-color: var(--papier); color: var(--encre); font: 400 19px/var(--ligne) var(--main);
    background-image:
      linear-gradient(90deg, transparent 51px, var(--marge) 51px, var(--marge) 53px, transparent 53px),
      linear-gradient(var(--violet) 1px, transparent 1px),
      linear-gradient(var(--violet-pale) 1px, transparent 1px),
      linear-gradient(90deg, var(--violet-pale) 1px, transparent 1px);
    background-size: 100% 100%, 100% var(--ligne), 100% calc(var(--ligne) / 4), var(--ligne) 100%;
    background-position: 0 0, 0 23px, 0 23px, 21px 0;
    background-attachment: local;
    padding: 24px 18px 40px 66px; }
  .feuille::-webkit-scrollbar { width: 0; }
  .numero { position: absolute; top: 6px; right: 16px; font: 700 16px var(--main); color: var(--encre); opacity: .7; }
  .feuille h2 { font: 700 30px/var(--ligne) var(--main); color: var(--encre); display: inline; text-decoration: underline var(--rouge) 3px; text-underline-offset: 6px; }
  .feuille .titre { margin-bottom: var(--ligne); }
  .sommaire h2 { display: block; margin-bottom: var(--ligne); }
  .feuille p { margin: 0 0 var(--ligne); }
  .feuille b { font-weight: 700; color: var(--rouge); }
  .polaroid { float: right; width: 46%; margin: 4px -4px 12px 14px; padding: 8px 8px 0; background: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.22); transform: rotate(3deg); position: relative; }
  .polaroid::before, .polaroid::after { content: ""; position: absolute; width: 56px; height: 20px; background: rgba(241,197,14,.55); top: -9px; }
  .polaroid::before { left: -14px; transform: rotate(-32deg); }
  .polaroid::after { right: -14px; transform: rotate(32deg); }
  .polaroid svg, .polaroid img { display: block; width: 100%; height: auto; }
  .polaroid figcaption { font: 400 15px/28px var(--main); color: #555; text-align: center; }
  .note { color: var(--rouge); transform: rotate(-1.5deg); transform-origin: left; }
  .prix { display: inline-block; font: 700 24px/1 var(--main); color: var(--rouge); padding: 8px 16px; border: 2.5px solid var(--rouge); border-radius: 50% 46% 52% 44% / 54% 50% 48% 46%; transform: rotate(-4deg); }
  .sceau { display: inline-block; font: 700 15px/1.2 var(--main); color: #fff; background: var(--rouge); padding: 2px 10px; border-radius: 4px; transform: rotate(-3deg); margin-left: 6px; vertical-align: middle; }

  /* Couverture : protège-cahier en pagne */
  .couverture { position: relative; height: 100%; display: grid; place-items: center; background: #000; }
  .couverture svg.wax { position: absolute; inset: 0; width: 100%; height: 100%; }
  .etiquette { position: relative; width: 78%; background: #fff; border-radius: 10px; padding: 18px 20px; color: var(--encre); font-family: var(--main); box-shadow: 0 10px 30px rgba(0,0,0,.4); border: 2px solid var(--encre); }
  .etiquette .ligne { border-bottom: 1.5px solid var(--violet); padding: 2px 0; display: flex; gap: 8px; align-items: baseline; }
  .etiquette .ligne + .ligne { margin-top: 6px; }
  .etiquette small { font: 500 13px var(--ui); color: #6b6b8a; flex: none; }
  .etiquette strong { font-size: 26px; line-height: 1.1; }
  .etiquette img { height: 34px; display: block; margin: 0 auto 10px; border-radius: 6px; }
  .tourner { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font: 700 15px var(--ui); color: #fff; text-shadow: 0 1px 6px #000; }
  .tourner span { display: inline-block; animation: invite 1.8s ease-in-out infinite; }
  @keyframes invite { 50% { transform: translateX(-8px); } }

  .sommaire ol { list-style: none; padding: 0; }
  .sommaire li { display: flex; align-items: baseline; gap: 6px; }
  .sommaire li.cat { margin-top: var(--ligne); font-weight: 700; color: var(--rouge); }
  .sommaire button { all: unset; cursor: pointer; display: flex; width: 100%; gap: 6px; align-items: baseline; }
  .sommaire button:focus-visible { outline: 2px solid var(--rouge); }
  .sommaire .pointilles { flex: 1; border-bottom: 2px dotted var(--violet); transform: translateY(-6px); }
  .fin a { color: var(--rouge); font-weight: 700; }

  /* Commandes */
  .commandes { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; max-width: 560px; width: 100%; justify-self: center; }
  .commandes button { border: 0; background: rgba(255,255,255,.1); color: var(--papier); border-radius: 999px; padding: 12px 16px; font-weight: 700; font-size: 15px; cursor: pointer; }
  .commandes button:disabled { opacity: .35; cursor: default; }
  .commandes .prec { justify-self: start; } .commandes .suiv { justify-self: end; background: var(--or); color: #2B160D; }
  .commandes .milieu { display: grid; justify-items: center; font-size: 13px; color: #d9c2a8; }
  .commandes .milieu button { background: none; padding: 2px 6px; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

  .cote { display: none; }
  @media (min-width: 1000px) {
    .scene { grid-template-columns: 1fr minmax(480px, 600px) 1fr; grid-template-rows: auto 1fr auto; column-gap: 48px; padding: 20px 40px; }
    .entete, .livre, .commandes { grid-column: 2; }
    .livre { max-width: none; }
    .feuille { font-size: 21px; padding-left: 80px; background-image: linear-gradient(90deg, transparent 63px, var(--marge) 63px, var(--marge) 65px, transparent 65px), linear-gradient(var(--violet) 1px, transparent 1px), linear-gradient(var(--violet-pale) 1px, transparent 1px), linear-gradient(90deg, var(--violet-pale) 1px, transparent 1px); }
    .cote { display: block; grid-column: 1; grid-row: 2; align-self: center; justify-self: end; max-width: 300px; }
    .cote h1 { font: 700 40px/1.1 var(--main); color: var(--or); }
    .cote p { margin-top: 14px; color: #d9c2a8; line-height: 1.5; }
    .cote kbd { font: 700 13px var(--ui); padding: 2px 7px; border-radius: 6px; border: 1px solid #6b4a36; }
  }
  @media (prefers-reduced-motion: reduce) { .tourner span { animation: none; } }
</style>
</head>
<body>
<div class="scene">
  <header class="entete">
    <img src="assets/logo.jpg" alt="Cook Africa, l'univers des mets africains">
    <a href="tel:+2250151459134"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2"/></svg>Appeler</a>
  </header>

  <aside class="cote">
    <h1>Le cahier de recettes de la maison</h1>
    <p>Chaque plat a sa page : d'où il vient, comment on le mange, et le petit conseil écrit en rouge.</p>
    <p>Tournez les pages avec la souris, ou avec <kbd>←</kbd> <kbd>→</kbd>.</p>
  </aside>

  <main class="livre" id="livre" aria-live="polite" aria-roledescription="carnet">
    <section class="page dessous" id="dessous"></section>
    <section class="page dessus" id="dessus"></section>
  </main>

  <nav class="commandes" aria-label="Tourner les pages">
    <button class="prec" id="prec" type="button">‹ Précédente</button>
    <div class="milieu"><span id="compteur"></span><button type="button" id="aller-sommaire">Sommaire</button></div>
    <button class="suiv" id="suiv" type="button">Suivante ›</button>
  </nav>
</div>

<script src="assets/menu.js"></script>
<script src="assets/recits.js"></script>
<script src="assets/assiette.js"></script>
<script>
  const D = window.COOKAFRICA, R = window.RECITS;
  const REDUIT = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Motif wax du protège-cahier (même générateur que la proposition 1)
  function motifWax(N, taille) {
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647, pick = a => a[Math.floor(rnd() * a.length)];
    const T = taille / N, PAL = ["#F1C50E", "#B30807", "#000", "#E8550F", "#FFFDF6"]; let out = "";
    for (let y = 0; y < N * 1.6; y++) for (let x = 0; x < N; x++) {
      const X = x * T, Y = y * T, cx = X + T / 2, cy = Y + T / 2, fond = pick(PAL), pal = PAL.filter(c => c !== fond), type = pick(["cible", "quart", "pois", "cible"]);
      let g = `<rect x="${X}" y="${Y}" width="${T}" height="${T}" fill="${fond}"/>`;
      if (type === "cible") [0.46, 0.34, 0.22, 0.1].forEach((r, i) => g += `<circle cx="${cx}" cy="${cy}" r="${T * r}" fill="${i % 2 ? fond : pal[i % pal.length]}"/>`);
      else if (type === "quart") { const k = pick([[X, Y], [X + T, Y], [X, Y + T], [X + T, Y + T]]); [1, 0.7, 0.4].forEach((r, i) => g += `<circle cx="${k[0]}" cy="${k[1]}" r="${T * r}" fill="${i % 2 ? fond : pal[(i + 1) % pal.length]}"/>`); }
      else for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) g += `<circle cx="${X + T * (i + .5) / 3}" cy="${Y + T * (j + .5) / 3}" r="${T * .1}" fill="${pal[1]}"/>`;
      out += `<clipPath id="w${x}_${y}"><rect x="${X}" y="${Y}" width="${T}" height="${T}"/></clipPath><g clip-path="url(#w${x}_${y})">${g}</g>`;
    }
    return `<svg class="wax" viewBox="0 0 ${taille} ${taille * 1.6}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${out}</svg>`;
  }

  // ——— Les pages ———
  const plats = D.categories.flatMap(c => D.plats.filter(p => p.cat === c.id));
  const DEBUT = 2; // 0 couverture, 1 sommaire, puis un plat par page
  const pages = [];
  pages.push(`<div class="couverture">${motifWax(4, 400)}
    <div class="etiquette">
      <img src="assets/logo.jpg" alt="">
      <div class="ligne"><small>Cahier de</small><strong>recettes de la maison</strong></div>
      <div class="ligne"><small>Classe</small><span>Cuisine de tout le pays</span></div>
      <div class="ligne"><small>École</small><span>Cook Africa, 2 Plateaux</span></div>
    </div>
    <div class="tourner"><span>‹</span> Glissez pour ouvrir</div></div>`);
  pages.push(`<div class="feuille sommaire"><span class="numero">1</span><h2>Sommaire</h2><ol>` +
    D.categories.map(c => `<li class="cat">${c.nom}</li>` + plats.map((p, i) => p.cat === c.id ? `<li><button type="button" data-page="${i + DEBUT}">${p.nom}<span class="pointilles"></span>p. ${i + DEBUT}</button></li>` : "").join("")).join("") +
    `</ol></div>`);
  plats.forEach((p, i) => {
    const r = R[p.nom] || {};
    pages.push(`<div class="feuille"><span class="numero">${i + DEBUT}</span>
      <div class="titre"><h2>${p.nom}</h2>${p.signature ? ' <span class="sceau">Signature</span>' : ""}</div>
      <figure class="polaroid">${p.photo ? `<img src="${p.photo}" alt="${p.nom}">` : illustration(p)}<figcaption>${p.accomp ? "avec " + p.accomp.toLowerCase() : "fait maison"}</figcaption></figure>
      <p><b>D'où ça vient :</b> ${r.origine || "La maison"}</p>
      <p>${r.recit || p.desc}</p>
      ${r.seMange ? `<p><b>Comment on le mange :</b> ${r.seMange}</p>` : ""}
      ${r.note ? `<p class="note">NB : ${r.note}</p>` : ""}
      <p><span class="prix">${formatPrix(p.prix)}</span></p>
    </div>`);
  });
  pages.push(`<div class="feuille fin"><span class="numero">${pages.length}</span><div class="titre"><h2>Venir goûter</h2></div>
    <p>${D.infos.horaires.map(h => `${h.jours} : ${h.heures}`).join("<br>")}</p>
    <p>${D.infos.adresse}</p>
    <p><b>Réserver :</b> <a href="${D.infos.telHref}">${D.infos.tel}</a></p>
    <p><a href="${D.infos.itineraire}" target="_blank" rel="noopener">Voir l'itinéraire</a></p>
    <p class="note">NB : venir avec appétit !</p></div>`);

  // ——— Tourner les pages ———
  const dessus = document.getElementById("dessus"), dessous = document.getElementById("dessous"), livre = document.getElementById("livre");
  const prec = document.getElementById("prec"), suiv = document.getElementById("suiv"), compteur = document.getElementById("compteur");
  let i = 0, occupe = false;
  const remplir = (el, n) => { el.innerHTML = pages[n] + '<div class="ombre"></div>'; };
  function afficher() {
    remplir(dessus, i); dessus.style.transform = ""; dessous.classList.remove("visible");
    prec.disabled = i === 0; suiv.disabled = i === pages.length - 1;
    compteur.textContent = i === 0 ? "Couverture" : `Page ${i} sur ${pages.length - 1}`;
    dessus.setAttribute("aria-label", i === 0 ? "Couverture du carnet" : `Page ${i}`);
  }
  // Anime le feuillet du dessus entre deux angles, puis applique la nouvelle page.
  function feuilleter(de, a, ensuite) {
    occupe = true;
    const fini = () => { occupe = false; ensuite(); };
    if (REDUIT) return fini();
    const anim = dessus.animate([{ transform: `rotateY(${de}deg)` }, { transform: `rotateY(${a}deg)` }], { duration: 520 * Math.abs(a - de) / 180 + 80, easing: "cubic-bezier(.3,.6,.2,1)", fill: "forwards" });
    const ombre = dessous.querySelector(".ombre");
    if (ombre) ombre.animate([{ opacity: a < de ? .9 : 0 }, { opacity: a < de ? 0 : .9 }], { duration: 520 });
    anim.onfinish = () => { anim.cancel(); fini(); };
  }
  function suivante(depuis = 0) {
    if (occupe || i >= pages.length - 1) return;
    remplir(dessous, i + 1); dessous.classList.add("visible");
    feuilleter(depuis, -180, () => { i++; afficher(); });
  }
  function precedente(depuis = -180) {
    if (occupe || i <= 0) return;
    remplir(dessous, i); dessous.classList.add("visible");
    remplir(dessus, i - 1);
    feuilleter(depuis, 0, () => { i--; afficher(); });
  }
  function allerA(n) {
    if (occupe || n === i) return;
    if (n === i + 1) return suivante();
    if (n === i - 1) return precedente();
    // Saut direct : on tourne une seule page, qui révèle la page voulue.
    remplir(dessous, n); dessous.classList.add("visible");
    if (n > i) feuilleter(0, -180, () => { i = n; afficher(); });
    else { remplir(dessus, n); remplir(dessous, i); feuilleter(-180, 0, () => { i = n; afficher(); }); }
  }
  prec.addEventListener("click", () => precedente());
  suiv.addEventListener("click", () => suivante());
  document.getElementById("aller-sommaire").addEventListener("click", () => allerA(1));
  addEventListener("keydown", e => { if (e.key === "ArrowRight") suivante(); if (e.key === "ArrowLeft") precedente(); });
  livre.addEventListener("click", e => { const b = e.target.closest("[data-page]"); if (b) allerA(+b.dataset.page); });

  // Glisser du doigt : la page suit le doigt, puis se tourne ou revient.
  let x0 = null, sens = null, angle = 0;
  livre.addEventListener("pointerdown", e => { if (occupe || e.button > 0) return; x0 = e.clientX; sens = null; });
  livre.addEventListener("pointermove", e => {
    if (x0 === null || occupe) return;
    const dx = e.clientX - x0, w = livre.clientWidth;
    if (!sens && Math.abs(dx) > 12) {
      if (dx < 0 && i < pages.length - 1) { sens = "suiv"; remplir(dessous, i + 1); }
      else if (dx > 0 && i > 0) { sens = "prec"; remplir(dessous, i); remplir(dessus, i - 1); }
      else { x0 = null; return; }
      dessous.classList.add("visible"); livre.setPointerCapture(e.pointerId);
    }
    if (!sens) return;
    angle = sens === "suiv" ? Math.max(-180, Math.min(0, dx / w * 200)) : Math.max(-180, Math.min(0, -180 + dx / w * 200));
    dessus.style.transform = `rotateY(${angle}deg)`;
  });
  const lacher = () => {
    if (x0 === null) return; x0 = null;
    if (!sens) return;
    const s = sens; sens = null; dessus.style.transform = "";
    if (s === "suiv") { if (angle < -50) feuilleter(angle, -180, () => { i++; afficher(); }); else feuilleter(angle, 0, afficher); }
    else { if (angle > -130) feuilleter(angle, 0, () => { i--; afficher(); }); else feuilleter(angle, -180, afficher); }
  };
  livre.addEventListener("pointerup", lacher);
  livre.addEventListener("pointercancel", lacher);

  afficher();
</script>
</body>
</html>
